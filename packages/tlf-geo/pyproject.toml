[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tlf-geo"
version = "0.1.1"
description = "Fuzzy-matched Nepal administrative boundary resolver for TLF"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Pujan Pandey", email = "your.email@example.com"}
]
keywords = ["nepal", "civic-data", "geography", "administrative-boundaries", "fuzzy-matching"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pandas",
    "pyyaml",
    "rapidfuzz",
]

[project.optional-dependencies]
dev = ["pytest", "build", "twine"]

[project.urls]
Homepage = "https://github.com/PujanPandey07/tlf-monorepo"
Issues = "https://github.com/PujanPandey07/tlf-monorepo/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tlf_geo = ["data/*.yaml"]