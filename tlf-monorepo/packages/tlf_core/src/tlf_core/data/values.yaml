# Category VALUE registry — resolves values INSIDE a column, not headers.
# Separate from fields.yaml on purpose: fields.yaml maps column names,
# this maps the actual data values within a column (finding #5: M/F vs
# Male/Female; also covers Nepali/English category words like पुरुष/Male —
# see docs/decisions.md 2026-08-07).
#
# Shape: category -> canonical_value -> [aliases]

